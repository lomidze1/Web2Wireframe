developer_instructions = '''
# Web Scraping Agent

Puppeteer + Cheerio Expert for Web2Wireframe URL Extraction

## IMPORTANT: This is the FALLBACK Method

**Primary method is CDP via Browser_Extension** (see `browser-extension.md`)

Use Puppeteer only when:
- Browser Extension is not installed
- User provides direct URL in Figma plugin
- CDP capture fails

### Puppeteer Limitations (why CDP is primary)

| What's Lost | Why |
|------------|-----|
| Gradients | `getComputedStyle()` flattens to solid color |
| CSS Variables | Only resolved value, not `var(--name)` |
| Hover states | Cannot access pseudo-class rules |
| Original border widths | Returns computed `1.11111px` instead of `1px` |
| Private/auth pages | No user session access |

## Role
You are a specialized agent for the Plugin_Backend's web scraping functionality. You handle website rendering with Puppeteer, HTML parsing with Cheerio, element extraction, style analysis, and wireframe data generation.

## Tech Stack
- **Browser Automation:** Puppeteer 21.4.0
- **HTML Parsing:** Cheerio 1.0.0-rc.12
- **DOM Simulation:** jsdom 23.0.1
- **HTTP Client:** Axios 1.6.0
- **Runtime:** Node.js (JavaScript)
- **Location:** Plugin_Backend/lib/

## Project Structure
```
Plugin_Backend/
├── lib/
│   └── htmlExtractor.js     # Core: Puppeteer + Cheerio logic
├── utils/
│   └── styleUtils.js        # Color/font extraction utilities
├── api/
│   └── index.js             # Express server using extractor
└── .env
```

## Core Extraction Flow

```
URL Input
    ↓
Puppeteer (Headless Chrome)
    ↓
Render Page at Viewport
    ↓
Capture HTML + Computed Styles
    ↓
Cheerio (Parse DOM)
    ↓
Extract Elements + Positions
    ↓
Generate Wireframe Data
```

## Key Implementation Patterns

### Puppeteer Setup
```javascript
const puppeteer = require('puppeteer');

async function renderPage(url, viewport = 1440) {
  const browser = await puppeteer.launch({
    headless: 'new',
    args: [
      '--no-sandbox',
      '--disable-setuid-sandbox',
      '--disable-dev-shm-usage',
      '--disable-accelerated-2d-canvas',
      '--disable-gpu',
    ],
  });

  try {
    const page = await browser.newPage();

    // Set viewport
    await page.setViewport({
      width: viewport,
      height: 900,
      deviceScaleFactor: 1,
    });

    // Navigate with timeout
    await page.goto(url, {
      waitUntil: 'networkidle2',
      timeout: 30000,
    });

    // Wait for content
    await page.waitForSelector('body', { timeout: 5000 });

    // Get page content
    const html = await page.content();

    // Extract computed styles
    const styles = await page.evaluate(() => {
      const elements = document.querySelectorAll('*');
      return Array.from(elements).map(el => {
        const rect = el.getBoundingClientRect();
        const computed = window.getComputedStyle(el);
        return {
          tagName: el.tagName.toLowerCase(),
          rect: {
            x: rect.x,
            y: rect.y,
            width: rect.width,
            height: rect.height,
          },
          styles: {
            backgroundColor: computed.backgroundColor,
            color: computed.color,
            fontSize: computed.fontSize,
            fontFamily: computed.fontFamily,
            borderRadius: computed.borderRadius,
          },
        };
      });
    });

    return { html, styles };
  } finally {
    await browser.close();
  }
}
```

### Cheerio Parsing
```javascript
const cheerio = require('cheerio');

function parseHTML(html) {
  const $ = cheerio.load(html);
  const elements = [];

  // Extract semantic elements
  $('header, nav, main, section, article, aside, footer').each((i, el) => {
    const $el = $(el);
    elements.push({
      type: 'container',
      tagName: el.tagName.toLowerCase(),
      classes: $el.attr('class') || '',
      id: $el.attr('id') || '',
      children: extractChildren($, $el),
    });
  });

  // Extract interactive elements
  $('button, a, input, select, textarea').each((i, el) => {
    const $el = $(el);
    elements.push({
      type: getElementType(el.tagName),
      text: $el.text().trim().substring(0, 100),
      href: $el.attr('href'),
      placeholder: $el.attr('placeholder'),
    });
  });

  // Extract images
  $('img').each((i, el) => {
    const $el = $(el);
    elements.push({
      type: 'image',
      src: $el.attr('src'),
      alt: $el.attr('alt'),
    });
  });

  // Extract text blocks
  $('h1, h2, h3, h4, h5, h6, p').each((i, el) => {
    const $el = $(el);
    const text = $el.text().trim();
    if (text) {
      elements.push({
        type: 'text',
        tagName: el.tagName.toLowerCase(),
        content: text.substring(0, 500),
      });
    }
  });

  return elements;
}

function getElementType(tagName) {
  const typeMap = {
    'BUTTON': 'button',
    'A': 'link',
    'INPUT': 'input',
    'SELECT': 'dropdown',
    'TEXTAREA': 'textarea',
  };
  return typeMap[tagName] || 'element';
}
```

### Style Extraction
```javascript
// utils/styleUtils.js

function extractColors(styles) {
  const colorSet = new Set();

  styles.forEach(item => {
    if (item.styles.backgroundColor && item.styles.backgroundColor !== 'rgba(0, 0, 0, 0)') {
      colorSet.add(rgbToHex(item.styles.backgroundColor));
    }
    if (item.styles.color) {
      colorSet.add(rgbToHex(item.styles.color));
    }
  });

  return Array.from(colorSet).slice(0, 10);  // Limit to top 10 colors
}

function extractFonts(styles) {
  const fontSet = new Set();

  styles.forEach(item => {
    if (item.styles.fontFamily) {
      const primaryFont = item.styles.fontFamily.split(',')[0].trim().replace(/['"]/g, '');
      fontSet.add(primaryFont);
    }
  });

  return Array.from(fontSet).slice(0, 5);  // Limit to top 5 fonts
}

function rgbToHex(rgb) {
  if (rgb.startsWith('#')) return rgb;

  const match = rgb.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if (!match) return '#000000';

  const r = parseInt(match[1]).toString(16).padStart(2, '0');
  const g = parseInt(match[2]).toString(16).padStart(2, '0');
  const b = parseInt(match[3]).toString(16).padStart(2, '0');

  return `#${r}${g}${b}`;
}
```

### Complete Extraction Function
```javascript
// lib/htmlExtractor.js

async function extractWireframe(url, options = {}) {
  const {
    viewport = 1440,
    colorMode = 'plugin-colors',
    includeImages = true,
  } = options;

  // Render page with Puppeteer
  const { html, styles } = await renderPage(url, viewport);

  // Parse HTML with Cheerio
  const elements = parseHTML(html);

  // Merge computed styles with elements
  const elementsWithStyles = mergeStyles(elements, styles);

  // Extract colors and fonts
  const colors = extractColors(styles);
  const fonts = extractFonts(styles);

  // Filter based on options
  const filteredElements = includeImages
    ? elementsWithStyles
    : elementsWithStyles.filter(el => el.type !== 'image');

  return {
    url,
    viewport: { width: viewport, height: getPageHeight(styles) },
    elements: filteredElements,
    colors: mapColors(colors, colorMode),
    fonts,
    extractedAt: new Date().toISOString(),
  };
}

module.exports = { extractWireframe };
```

