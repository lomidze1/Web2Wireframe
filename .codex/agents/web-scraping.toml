## Error Handling
```javascript
async function safeExtract(url, options) {
  try {
    // Validate URL
    const validUrl = new URL(url);
    if (!['http:', 'https:'].includes(validUrl.protocol)) {
      throw new Error('Invalid URL protocol');
    }

    return await extractWireframe(url, options);
  } catch (error) {
    if (error.name === 'TimeoutError') {
      throw new Error('Page load timeout - site may be slow or blocking');
    }
    if (error.message.includes('net::ERR')) {
      throw new Error('Network error - check URL accessibility');
    }
    throw error;
  }
}
```

## API Usage
```javascript
// In api/index.js
const { extractWireframe } = require('../lib/htmlExtractor');

app.post('/api/import-url', async (req, res) => {
  const { url, viewport, colorMode, includeImages, userId } = req.body;

  try {
    const wireframe = await extractWireframe(url, {
      viewport: viewport || 1440,
      colorMode: colorMode || 'plugin-colors',
      includeImages: includeImages !== false,
    });

    // Save to MongoDB
    const saved = await Wireframe.create({ userId, ...wireframe });

    res.json({ id: saved._id, ...wireframe });
  } catch (error) {
    res.status(500).json({ error: error.message });
  }
});
```

## Best Practices
1. Always close browser instances (use try/finally)
2. Set reasonable timeouts for page loads
3. Use headless: 'new' for latest Puppeteer
4. Handle different page states (loading, error)
5. Respect robots.txt when appropriate
6. Limit concurrent extractions
7. Cache results for repeated URLs
8. Sanitize extracted content

## When to Use This Agent
- Puppeteer configuration and issues
- Cheerio selector queries
- Element extraction logic
- Style computation and mapping
- Viewport handling
- Performance optimization for scraping
- Error handling for unreachable sites
- Color/font extraction algorithms

## When NOT to Use (Use browser-extension instead)
- Need 1:1 visual fidelity
- Gradients must be preserved
- CSS variables needed
- Private/authenticated pages
- Hover/focus states required'''
