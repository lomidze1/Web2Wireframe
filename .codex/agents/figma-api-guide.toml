## Variables (Design Tokens)

Reference: https://developers.figma.com/docs/plugins/api/properties/figma-variables-createvariablecollection/

### Variable Types
```typescript
// CSS custom properties → Figma Variables
// --color-primary: #0066FF   →  'COLOR'
// --spacing-md: 16px         →  'FLOAT'
// --font-size-lg: 24px       →  'FLOAT'
// --show-border: true        →  'BOOLEAN'
// --font-family: "Inter"     →  'STRING'

type VariableResolvedDataType = 'COLOR' | 'FLOAT' | 'STRING' | 'BOOLEAN';
```

### Variable Collections (CSS :root equivalent)
```typescript
// figma.variables.createVariableCollection(name: string): VariableCollection
// Creates a new variable collection - like CSS :root or a theme file

interface VariableCollection {
  id: string;
  name: string;
  defaultModeId: string;           // Default mode (e.g., "Light")
  modes: { modeId: string; name: string }[];  // All modes
  variableIds: string[];           // Variables in this collection
  hiddenFromPublishing: boolean;   // Don't publish to library

  // Methods
  addMode(name: string): string;   // Add mode, returns modeId
  removeMode(modeId: string): void;
  renameMode(modeId: string, newName: string): void;
  remove(): void;                  // Delete collection
}

// Example: Create from CSS :root
const collection = figma.variables.createVariableCollection('Design System');
console.log(collection.defaultModeId);  // Use for default values
```

### Creating Variables
```typescript
// figma.variables.createVariable(name, collectionId, resolvedType): Variable

interface Variable {
  id: string;
  name: string;                    // "color/primary" → folder: color, name: primary
  resolvedType: VariableResolvedDataType;
  variableCollectionId: string;

  // Get/Set values per mode
  valuesByMode: { [modeId: string]: VariableValue };
  setValueForMode(modeId: string, value: VariableValue): void;

  // Code generation names (platform-specific)
  codeSyntax: VariableCodeSyntax;
  setVariableCodeSyntax(platform: CodeSyntaxPlatform, syntax: string): void;

  // Scopes - where can this variable be used?
  scopes: VariableScope[];

  remove(): void;
}

// Create color variable (CSS: --color-primary: #0066FF)
const colorVar = figma.variables.createVariable(
  'color/primary',           // name with folder
  collection.id,             // collection ID
  'COLOR'                    // type
);
colorVar.setValueForMode(collection.defaultModeId, { r: 0, g: 0.4, b: 1 });

// Create spacing variable (CSS: --spacing-md: 16px)
const spacingVar = figma.variables.createVariable('spacing/md', collection.id, 'FLOAT');
spacingVar.setValueForMode(collection.defaultModeId, 16);

// Create boolean variable (CSS: --show-border: true)
const boolVar = figma.variables.createVariable('show/border', collection.id, 'BOOLEAN');
boolVar.setValueForMode(collection.defaultModeId, true);
```

### Variable Scopes (Where Variable Can Be Used)
```typescript
type VariableScope =
  // Color scopes
  | 'ALL_SCOPES'           // Anywhere
  | 'ALL_FILLS'            // Any fill
  | 'FRAME_FILL'           // Frame backgrounds
  | 'SHAPE_FILL'           // Shape fills
  | 'TEXT_FILL'            // Text colors
  | 'STROKE_COLOR'         // Border colors
  | 'EFFECT_COLOR'         // Shadow colors

  // Float scopes
  | 'WIDTH_HEIGHT'         // width, height
  | 'GAP'                  // itemSpacing, counterAxisSpacing
  | 'CORNER_RADIUS'        // cornerRadius
  | 'STROKE_FLOAT'         // strokeWeight
  | 'PARAGRAPH_SPACING'    // paragraphSpacing
  | 'PARAGRAPH_INDENT'     // paragraphIndent
  | 'FONT_SIZE'            // fontSize
  | 'LINE_HEIGHT'          // lineHeight
  | 'LETTER_SPACING'       // letterSpacing
  | 'OPACITY';             // opacity

// Restrict variable to specific uses
colorVar.scopes = ['FRAME_FILL', 'SHAPE_FILL'];  // Only for backgrounds
spacingVar.scopes = ['GAP', 'WIDTH_HEIGHT'];      // Only for spacing/sizing
```

### Get Existing Variables
```typescript
// Get all local variables
const allVariables = figma.variables.getLocalVariables();

// Filter by type
const colorVars = figma.variables.getLocalVariables('COLOR');
const floatVars = figma.variables.getLocalVariables('FLOAT');

// Get all collections
const collections = figma.variables.getLocalVariableCollections();

// Get by ID
const variable = figma.variables.getVariableById(id);
const collection = figma.variables.getVariableCollectionById(id);
```

### Binding Variables to Nodes
```typescript
// Bind color variable to fill
node.setBoundVariable('fills', 0, colorVar);

// Bind spacing variable to padding
frame.setBoundVariable('paddingTop', spacingVar);
frame.setBoundVariable('paddingBottom', spacingVar);

// Bind to corner radius
node.setBoundVariable('cornerRadius', radiusVar);

// Check bound variables
const boundVars = node.boundVariables;
```

### Variable Modes (Themes)
```typescript
// CSS: prefers-color-scheme
// Figma: Variable Modes

// Add mode to collection
const darkModeId = collection.addMode('Dark');

// Set value for dark mode
colorVar.setValueForMode(darkModeId, { r: 0.2, g: 0.6, b: 1 });

// Apply mode to frame
frame.setExplicitVariableModeForCollection(collection.id, darkModeId);
```

### Code Syntax (Platform Export)
```typescript
// Define platform-specific names
variable.setVariableCodeSyntax('WEB', '--color-primary');
variable.setVariableCodeSyntax('iOS', 'ColorPrimary');
variable.setVariableCodeSyntax('ANDROID', 'colorPrimary');
```

