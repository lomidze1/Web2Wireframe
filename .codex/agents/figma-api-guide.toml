# FIGMA PLUGIN API REFERENCE

## Color System

### RGB/RGBA (0-1 Range)

Figma uses **0 to 1 range** for colors, NOT 0-255.

```typescript
interface RGB {
  r: number;  // 0-1
  g: number;  // 0-1
  b: number;  // 0-1
}

interface RGBA extends RGB {
  a: number;  // 0-1
}
```

### CSS → Figma Color Conversion

```typescript
// CSS rgb(255, 128, 0) → Figma
const figmaColor: RGB = {
  r: 255 / 255,  // 1
  g: 128 / 255,  // 0.502
  b: 0 / 255     // 0
};

// CSS rgba(0, 0, 0, 0.5) → Figma
const figmaRGBA: RGBA = {
  r: 0,
  g: 0,
  b: 0,
  a: 0.5  // Alpha stays same
};

// CSS hex #FF8000 → Figma
function hexToFigma(hex: string): RGB {
  const r = parseInt(hex.slice(1, 3), 16) / 255;
  const g = parseInt(hex.slice(3, 5), 16) / 255;
  const b = parseInt(hex.slice(5, 7), 16) / 255;
  return { r, g, b };
}
```

### Utility Method
```typescript
// Figma provides helper for CSS colors including alpha
const paint = figma.util.solidPaint('#FF00FF88');  // Hex with alpha
```

---

## Paint Types (Fills & Strokes)

Reference: https://developers.figma.com/docs/plugins/api/Paint/

```typescript
type Paint = SolidPaint | GradientPaint | ImagePaint | VideoPaint;
```

### Common Paint Properties (All Paint Types)
```typescript
interface BasePaint {
  visible?: boolean;     // default: true - CSS: visibility
  opacity?: number;      // 0-1, default: 1 - CSS: opacity on background
  blendMode?: BlendMode; // default: "NORMAL" - CSS: background-blend-mode
}
```

### Paint Array Layering (CRITICAL!)
```typescript
// CSS backgrounds: FIRST = TOP (front), LAST = BOTTOM (back)
// background: gradient1, gradient2, solid;  // gradient1 on top
//
// Figma fills: FIRST = BOTTOM (back), LAST = TOP (front)
// fills[0] = back, fills[fills.length-1] = front
//
// MUST REVERSE when converting CSS → Figma!
node.fills = cssBackgrounds.reverse();
```

### SolidPaint (CSS solid colors)
```typescript
interface SolidPaint {
  type: 'SOLID';
  color: RGB;          // NOT RGBA - use opacity for alpha
  opacity?: number;
  visible?: boolean;
  blendMode?: BlendMode;
}

// CSS background-color: rgba(255, 0, 0, 0.5)
const fill: SolidPaint = {
  type: 'SOLID',
  color: { r: 1, g: 0, b: 0 },
  opacity: 0.5
};
```

### GradientPaint (CSS gradients)
```typescript
interface GradientPaint {
  type: 'GRADIENT_LINEAR' | 'GRADIENT_RADIAL' | 'GRADIENT_ANGULAR' | 'GRADIENT_DIAMOND';
  gradientTransform: Transform;  // 2x3 matrix
  gradientStops: ColorStop[];
  opacity?: number;
  visible?: boolean;
  blendMode?: BlendMode;
}

interface ColorStop {
  position: number;  // 0-1
  color: RGBA;
}
```

#### CSS Linear Gradient → Figma
```typescript
// CSS: linear-gradient(90deg, red, blue)
const gradient: GradientPaint = {
  type: 'GRADIENT_LINEAR',
  gradientTransform: [
    [1, 0, 0],   // 90deg = horizontal
    [0, 1, 0]
  ],
  gradientStops: [
    { position: 0, color: { r: 1, g: 0, b: 0, a: 1 } },  // red
    { position: 1, color: { r: 0, g: 0, b: 1, a: 1 } }   // blue
  ]
};
```

#### Gradient Transform Matrix (Critical!)
The `gradientTransform` is a 2x3 affine transform matrix:
```
[[a, c, tx],
 [b, d, ty]]

Where:
- a, d = scale X, scale Y
- b, c = skew/rotation components
- tx, ty = translation (0-1 normalized)
```

**Linear Gradient Angles:**
```typescript
// CSS angle → Figma transform
function linearGradientTransform(angleDeg: number): Transform {
  // CSS: 0deg = bottom→top, 90deg = left→right
  // Figma: needs rotation matrix
  const angleRad = ((angleDeg - 90) * Math.PI) / 180;
  const cos = Math.cos(angleRad);
  const sin = Math.sin(angleRad);

  return [
    [cos, sin, 0.5 - cos * 0.5 - sin * 0.5],
    [-sin, cos, 0.5 + sin * 0.5 - cos * 0.5],
  ];
}
```

Common angles:
- **0deg (to top):** `[[0, -1, 0.5], [1, 0, 0.5]]`
- **90deg (to right):** `[[1, 0, 0], [0, 1, 0]]`
- **180deg (to bottom):** `[[0, 1, 0.5], [-1, 0, 0.5]]`
- **270deg (to left):** `[[-1, 0, 1], [0, -1, 1]]`

