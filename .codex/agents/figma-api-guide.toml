### Radial Gradient Transform (CRITICAL FOR CSS CONVERSION!)

CSS radial gradients have complex positioning and sizing that MUST be properly converted.

#### CSS Radial Gradient Syntax
```css
/* Full syntax */
radial-gradient([shape] [size] at [position], color-stops)

/* Examples */
radial-gradient(circle at 20% 20%, rgba(59,130,246,0.08), transparent 28%)
radial-gradient(ellipse farthest-corner at center, red, blue)
radial-gradient(50px 100px at 0% 0%, red, blue)
```

#### Key Concepts

**1. Shape**: `circle` or `ellipse` (default)
- `circle` → in Figma, must calculate equal X/Y scale
- `ellipse` → can have different X/Y scales

**2. Size Keywords** (default: `farthest-corner`):
- `closest-side` - gradient ends at closest edge
- `farthest-side` - gradient ends at farthest edge
- `closest-corner` - gradient ends at closest corner
- `farthest-corner` - gradient ends at farthest corner

**3. Position**: `at X Y` (default: `at 50% 50%`)

#### Figma Radial Gradient Coordinate System

```
Gradient space: (0,0) ─────────────────── (1,0)
                  │                          │
                  │      Center (0.5, 0.5)   │
                  │           ●              │
                  │                          │
                (0,1) ─────────────────── (1,1)
```

- Default center is (0.5, 0.5) in gradient space
- gradientTransform moves/scales from this default

#### CSS → Figma Radial Gradient Conversion

```typescript
interface RadialGradientParams {
  centerX: number;      // 0-1, CSS "at X%"
  centerY: number;      // 0-1, CSS "at Y%"
  elementWidth: number; // Element width in px
  elementHeight: number;// Element height in px
  shape: 'circle' | 'ellipse';
  size: 'closest-side' | 'farthest-side' | 'closest-corner' | 'farthest-corner';
}

function radialGradientTransform(params: RadialGradientParams): Transform {
  const { centerX, centerY, elementWidth, elementHeight, shape, size } = params;

  // Step 1: Calculate distance to edges/corners from center
  const distLeft = centerX * elementWidth;
  const distRight = (1 - centerX) * elementWidth;
  const distTop = centerY * elementHeight;
  const distBottom = (1 - centerY) * elementHeight;

  // Step 2: Calculate gradient radius based on size keyword
  let radiusX: number, radiusY: number;

  switch (size) {
    case 'closest-side':
      radiusX = Math.min(distLeft, distRight);
      radiusY = Math.min(distTop, distBottom);
      break;
    case 'farthest-side':
      radiusX = Math.max(distLeft, distRight);
      radiusY = Math.max(distTop, distBottom);
      break;
    case 'closest-corner': {
      const closestX = Math.min(distLeft, distRight);
      const closestY = Math.min(distTop, distBottom);
      const dist = Math.sqrt(closestX ** 2 + closestY ** 2);
      radiusX = radiusY = dist;
      break;
    }
    case 'farthest-corner':
    default: {
      const farthestX = Math.max(distLeft, distRight);
      const farthestY = Math.max(distTop, distBottom);
      const dist = Math.sqrt(farthestX ** 2 + farthestY ** 2);
      radiusX = radiusY = dist;
      break;
    }
  }

  // Step 3: For circle, use same radius for both axes
  if (shape === 'circle') {
    const radius = size.includes('corner')
      ? Math.sqrt(radiusX ** 2 + radiusY ** 2) / Math.sqrt(2)
      : Math.max(radiusX, radiusY);
    radiusX = radiusY = radius;
  }

  // Step 4: Calculate scale (gradient size relative to element)
  // Figma gradient fills 0-1 space, so we need to scale it
  const scaleX = (radiusX * 2) / elementWidth;
  const scaleY = (radiusY * 2) / elementHeight;

  // Step 5: Calculate translation
  // Move center from (0.5, 0.5) to (centerX, centerY)
  // But account for scaling!
  const tx = centerX;
  const ty = centerY;

  // Final transform: scale then translate
  return [
    [scaleX, 0, tx - scaleX * 0.5],
    [0, scaleY, ty - scaleY * 0.5],
  ];
}
```

#### Example: CSS `circle at 20% 20%`

```typescript
// CSS: radial-gradient(circle at 20% 20%, rgba(59,130,246,0.08), transparent 28%)
// Element: 1440px × 1276px

const transform = radialGradientTransform({
  centerX: 0.2,          // 20%
  centerY: 0.2,          // 20%
  elementWidth: 1440,
  elementHeight: 1276,
  shape: 'circle',
  size: 'farthest-corner',  // CSS default
});

// Result similar to html.to.design:
// ~[[1.14, 0, 0.2 - 1.14*0.5], [0, 1.12, 0.2 - 1.12*0.5]]
// = [[1.14, 0, -0.37], [0, 1.12, -0.36]]
```

#### Common Mistakes

```typescript
// ❌ WRONG: Using center position directly as translation
gradientTransform: [
  [1, 0, centerX],   // Wrong!
  [0, 1, centerY],   // Wrong!
]

// ❌ WRONG: Not accounting for scale when translating
gradientTransform: [
  [scaleX, 0, centerX - 0.5],  // Wrong offset!
  [0, scaleY, centerY - 0.5],
]

// ✅ CORRECT: Scale affects translation
gradientTransform: [
  [scaleX, 0, centerX - scaleX * 0.5],
  [0, scaleY, centerY - scaleY * 0.5],
]
```

### ImagePaint (CSS background-image)
```typescript
interface ImagePaint {
  type: 'IMAGE';
  scaleMode: 'FILL' | 'FIT' | 'CROP' | 'TILE';
  imageHash: string | null;
  imageTransform?: Transform;  // for CROP
  scalingFactor?: number;      // for TILE
  rotation?: number;           // 0, 90, 180, 270
  filters?: ImageFilters;
}

// To set image, first create hash:
const imageHash = figma.createImage(imageBytes).hash;
```

CSS background-size mapping:
- `cover` → `scaleMode: 'FILL'`
- `contain` → `scaleMode: 'FIT'`
- `repeat` → `scaleMode: 'TILE'`

