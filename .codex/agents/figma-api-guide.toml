## Blend Modes

Reference: https://developers.figma.com/docs/plugins/api/BlendMode/

```typescript
type BlendMode =
  // Normal
  | 'PASS_THROUGH'  // Only for Groups/Frames - children blend individually
  | 'NORMAL'

  // Darken modes
  | 'DARKEN'        // CSS: darken
  | 'MULTIPLY'      // CSS: multiply
  | 'COLOR_BURN'    // CSS: color-burn
  | 'LINEAR_BURN'   // CSS: (no direct equivalent)

  // Lighten modes
  | 'LIGHTEN'       // CSS: lighten
  | 'SCREEN'        // CSS: screen
  | 'COLOR_DODGE'   // CSS: color-dodge
  | 'LINEAR_DODGE'  // CSS: (no direct equivalent)

  // Contrast modes
  | 'OVERLAY'       // CSS: overlay
  | 'SOFT_LIGHT'    // CSS: soft-light
  | 'HARD_LIGHT'    // CSS: hard-light

  // Inversion modes
  | 'DIFFERENCE'    // CSS: difference
  | 'EXCLUSION'     // CSS: exclusion

  // Component modes
  | 'HUE'           // CSS: hue
  | 'SATURATION'    // CSS: saturation
  | 'COLOR'         // CSS: color
  | 'LUMINOSITY';   // CSS: luminosity

// Apply to node
node.blendMode = 'MULTIPLY';
node.opacity = 0.5;

// Apply to individual paint
const paint: SolidPaint = {
  type: 'SOLID',
  color: { r: 1, g: 0, b: 0 },
  blendMode: 'SCREEN',  // Per-paint blend mode
  opacity: 0.8
};
```

### CSS mix-blend-mode → Figma BlendMode
```typescript
const cssToFigmaBlendMode: Record<string, BlendMode> = {
  'normal': 'NORMAL',
  'multiply': 'MULTIPLY',
  'screen': 'SCREEN',
  'overlay': 'OVERLAY',
  'darken': 'DARKEN',
  'lighten': 'LIGHTEN',
  'color-dodge': 'COLOR_DODGE',
  'color-burn': 'COLOR_BURN',
  'hard-light': 'HARD_LIGHT',
  'soft-light': 'SOFT_LIGHT',
  'difference': 'DIFFERENCE',
  'exclusion': 'EXCLUSION',
  'hue': 'HUE',
  'saturation': 'SATURATION',
  'color': 'COLOR',
  'luminosity': 'LUMINOSITY',
};
```

