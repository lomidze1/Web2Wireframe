## Transform Matrix

### 2x3 Affine Transform
```typescript
type Transform = [[number, number, number], [number, number, number]];
// [[a, c, tx], [b, d, ty]]
// a, d = scale
// b, c = skew/rotation
// tx, ty = translation
```

### relativeTransform (Position & Rotation)
```typescript
// Node's transform relative to parent
node.relativeTransform = [
  [1, 0, x],  // [scaleX, skewY, translateX]
  [0, 1, y]   // [skewX, scaleY, translateY]
];

// CSS: transform: rotate(45deg)
const angle = 45 * (Math.PI / 180);
node.relativeTransform = [
  [Math.cos(angle), -Math.sin(angle), x],
  [Math.sin(angle), Math.cos(angle), y]
];

// CSS: transform: scale(1.5)
node.relativeTransform = [
  [1.5, 0, x],
  [0, 1.5, y]
];
```

### Common Transforms
```typescript
// Identity (no transform)
[[1, 0, 0], [0, 1, 0]]

// Translate to (100, 50)
[[1, 0, 100], [0, 1, 50]]

// Scale 2x
[[2, 0, 0], [0, 2, 0]]

// Rotate 90° clockwise
[[0, -1, 0], [1, 0, 0]]

// Flip horizontal
[[-1, 0, width], [0, 1, 0]]
```

