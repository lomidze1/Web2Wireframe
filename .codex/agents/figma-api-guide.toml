    saturation: -0.5,   // -1 to 1
    temperature: 0,     // -1 to 1
    tint: 0,            // -1 to 1
    highlights: 0,      // -1 to 1
    shadows: 0          // -1 to 1
  }
};

// CSS: filter: grayscale(100%)
filters: { saturation: -1 }

// CSS: filter: brightness(1.2)
