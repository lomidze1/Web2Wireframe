## Node Types

### Primary Nodes for Wireframes

| CSS Element | Figma Node | Create Method |
|-------------|------------|---------------|
| `<div>` | FrameNode | `figma.createFrame()` |
| `<span>`, text | TextNode | `figma.createText()` |
| Simple box | RectangleNode | `figma.createRectangle()` |
| Circle | EllipseNode | `figma.createEllipse()` |
| SVG | VectorNode | `figma.createVector()` |
| Image | RectangleNode + ImagePaint | See below |
| Group (no layout) | GroupNode | `figma.group([...], parent)` |

### FrameNode (Primary Container)
```typescript
const frame = figma.createFrame();
frame.name = 'Container';
frame.resize(width, height);
frame.x = 0;
frame.y = 0;

// Fills (background)
frame.fills = [{ type: 'SOLID', color: { r: 1, g: 1, b: 1 } }];

// Strokes (border)
frame.strokes = [{ type: 'SOLID', color: { r: 0, g: 0, b: 0 } }];
frame.strokeWeight = 1;

// Corner radius
frame.cornerRadius = 8;
// Or individual corners:
frame.topLeftRadius = 8;
frame.topRightRadius = 8;
frame.bottomLeftRadius = 0;
frame.bottomRightRadius = 0;

// Clipping (overflow: hidden)
frame.clipsContent = true;

// Add children
frame.appendChild(childNode);
```

### TextNode
```typescript
const text = figma.createText();

// MUST load font first!
await figma.loadFontAsync({ family: 'Inter', style: 'Regular' });

text.characters = 'Hello World';
text.fontSize = 16;
text.fontName = { family: 'Inter', style: 'Regular' };

// Text color (fills, not a color property!)
text.fills = [{ type: 'SOLID', color: { r: 0, g: 0, b: 0 } }];

// Line height
text.lineHeight = { value: 24, unit: 'PIXELS' };
// Or: { value: 150, unit: 'PERCENT' }
// Or: { unit: 'AUTO' }

// Letter spacing
text.letterSpacing = { value: 0.5, unit: 'PIXELS' };
// Or: { value: 5, unit: 'PERCENT' }

// Text alignment
text.textAlignHorizontal = 'LEFT' | 'CENTER' | 'RIGHT' | 'JUSTIFIED';
text.textAlignVertical = 'TOP' | 'CENTER' | 'BOTTOM';

// Text decoration
text.textDecoration = 'NONE' | 'UNDERLINE' | 'STRIKETHROUGH';

// Text case
text.textCase = 'ORIGINAL' | 'UPPER' | 'LOWER' | 'TITLE' | 'SMALL_CAPS' | 'SMALL_CAPS_FORCED';

// Auto-width vs fixed width
text.textAutoResize = 'WIDTH_AND_HEIGHT' | 'HEIGHT' | 'NONE' | 'TRUNCATE';
```

### RectangleNode (Simple shapes, images)
```typescript
const rect = figma.createRectangle();
rect.resize(100, 100);
rect.cornerRadius = 4;

// For images:
const imageBytes = await fetchImageAsUint8Array(url);
const image = figma.createImage(imageBytes);

rect.fills = [{
  type: 'IMAGE',
  imageHash: image.hash,
  scaleMode: 'FILL'
}];
```

