## Performance Tips

1. **Batch operations** - Group multiple changes before committing
2. **Load fonts once** - Cache loaded fonts, don't reload
3. **Use async methods** - `setTextStyleIdAsync()` for styles
4. **Avoid mixed values** - Check for `figma.mixed` before reading

```typescript
// Check for mixed values in text ranges
const fontSize = textNode.fontSize;
if (fontSize === figma.mixed) {
  // Text has multiple font sizes
  const segments = textNode.getStyledTextSegments(['fontSize']);
}
```

