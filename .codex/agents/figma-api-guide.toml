## Common Transformations Summary

### CSS Property → Figma Property Quick Reference

| CSS Property | Figma Property | Notes |
|--------------|----------------|-------|
| `width` | `node.resize(w, h)` | Use resize(), not width directly |
| `height` | `node.resize(w, h)` | |
| `background-color` | `node.fills` | Array of Paint |
| `border` | `node.strokes` + `strokeWeight` | |
| `border-radius` | `node.cornerRadius` | |
| `box-shadow` | `node.effects` | Array of Effect |
| `opacity` | `node.opacity` | 0-1 |
| `color` (text) | `textNode.fills` | NOT a color property |
| `font-size` | `textNode.fontSize` | |
| `font-family` | `textNode.fontName` | Must load font first |
| `font-weight` | `textNode.fontName.style` | 'Bold', 'Medium', etc. |
| `line-height` | `textNode.lineHeight` | Object with unit |
| `letter-spacing` | `textNode.letterSpacing` | Object with unit |
| `text-align` | `textNode.textAlignHorizontal` | |
| `text-transform` | `textNode.textCase` | |
| `display: flex` | `frame.layoutMode` | 'HORIZONTAL' or 'VERTICAL' |
| `gap` | `frame.itemSpacing` | |
| `padding` | `frame.padding*` | 4 separate properties |
| `overflow: hidden` | `frame.clipsContent = true` | |
| `position: absolute` | Child of frame + constraints | |
| `z-index` | Order in parent.children | First = back |

