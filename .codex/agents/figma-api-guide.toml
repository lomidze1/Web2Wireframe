## Z-Index and Ordering

Figma uses **child order** instead of z-index:
```typescript
// First child = back, Last child = front
parent.children[0];  // z-index: 0 (back)
parent.children[parent.children.length - 1];  // front

// Move to front (highest z-index)
parent.appendChild(node);

// Move to back (lowest z-index)
parent.insertChild(0, node);

// Move to specific index
parent.insertChild(3, node);
```

