## Auto Layout (CSS Flexbox)

```typescript
const frame = figma.createFrame();

// Enable auto layout
frame.layoutMode = 'HORIZONTAL' | 'VERTICAL';  // flex-direction

// Gap (gap property)
frame.itemSpacing = 16;

// Padding
frame.paddingTop = 16;
frame.paddingRight = 16;
frame.paddingBottom = 16;
frame.paddingLeft = 16;

// Alignment (align-items)
frame.counterAxisAlignItems = 'MIN' | 'CENTER' | 'MAX' | 'BASELINE';
// MIN = flex-start, MAX = flex-end

// Justify (justify-content)
frame.primaryAxisAlignItems = 'MIN' | 'CENTER' | 'MAX' | 'SPACE_BETWEEN';

// Sizing
frame.primaryAxisSizingMode = 'AUTO' | 'FIXED';   // width for HORIZONTAL
frame.counterAxisSizingMode = 'AUTO' | 'FIXED';   // height for HORIZONTAL

// Counter Axis Align Content (align-content for wrapped layouts)
// Reference: https://developers.figma.com/docs/plugins/api/properties/nodes-counteraxisaligncontent/
// Only applies when layoutWrap = 'WRAP'
frame.counterAxisAlignContent = 'AUTO' | 'SPACE_BETWEEN';
// AUTO = rows/columns packed together (align-content: flex-start)
// SPACE_BETWEEN = space distributed (align-content: space-between)

// Child sizing (on child nodes)
childNode.layoutAlign = 'STRETCH' | 'INHERIT';    // align-self: stretch
childNode.layoutGrow = 1;                          // flex-grow: 1
```

### CSS Flexbox → Figma Auto Layout

| CSS | Figma |
|-----|-------|
| `flex-direction: row` | `layoutMode: 'HORIZONTAL'` |
| `flex-direction: column` | `layoutMode: 'VERTICAL'` |
| `gap: 16px` | `itemSpacing: 16` |
| `padding: 16px` | `paddingTop/Right/Bottom/Left: 16` |
| `align-items: center` | `counterAxisAlignItems: 'CENTER'` |
| `align-items: flex-start` | `counterAxisAlignItems: 'MIN'` |
| `align-items: flex-end` | `counterAxisAlignItems: 'MAX'` |
| `justify-content: center` | `primaryAxisAlignItems: 'CENTER'` |
| `justify-content: space-between` | `primaryAxisAlignItems: 'SPACE_BETWEEN'` |
| `flex-grow: 1` (child) | `layoutGrow: 1` |
| `align-self: stretch` (child) | `layoutAlign: 'STRETCH'` |

---

## Strokes (CSS Borders)

```typescript
node.strokes = [{ type: 'SOLID', color: { r: 0, g: 0, b: 0 } }];
node.strokeWeight = 1;

// Border sides (like border-top, etc.)
node.strokeTopWeight = 1;
node.strokeRightWeight = 0;
node.strokeBottomWeight = 1;
node.strokeLeftWeight = 0;

// Stroke position
node.strokeAlign = 'INSIDE' | 'OUTSIDE' | 'CENTER';

// Dashed border
node.dashPattern = [5, 5];  // [dash, gap]

// Stroke cap (for lines)
node.strokeCap = 'NONE' | 'ROUND' | 'SQUARE' | 'ARROW_LINES' | 'ARROW_EQUILATERAL';

// Stroke join
node.strokeJoin = 'MITER' | 'BEVEL' | 'ROUND';
```

