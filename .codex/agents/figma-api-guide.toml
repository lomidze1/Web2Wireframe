## Vector Nodes (SVG)

### Creating Vectors
```typescript
// Basic vector creation
const vector = figma.createVector();

// From SVG path data
vector.vectorPaths = [{
  windingRule: 'NONZERO',  // or 'EVENODD'
  data: 'M 0 0 L 100 0 L 100 100 L 0 100 Z'  // SVG path d attribute
}];
```

### VectorPath Structure
```typescript
interface VectorPath {
  windingRule: 'NONZERO' | 'EVENODD';  // SVG fill-rule
  data: string;  // SVG path commands
}

// CSS clip-path: polygon() → Figma vector
// polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)
const pathData = 'M 0 0 L 100 0 L 100 100 L 0 100 Z';
```

### VectorNetwork (Complex Paths)
```typescript
// For paths with multiple subpaths, shared vertices, or fills
interface VectorNetwork {
  vertices: VectorVertex[];   // Points
  segments: VectorSegment[];  // Lines/curves between points
  regions?: VectorRegion[];   // Closed areas for fills
}

// Use when SVG has:
// - Multiple disconnected paths
// - Strokes that share endpoints
// - Complex boolean operations
```

