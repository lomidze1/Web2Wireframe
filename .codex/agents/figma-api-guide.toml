## Layout Grids

```typescript
interface RowsColsLayoutGrid {
  pattern: 'ROWS' | 'COLUMNS';
  alignment: 'MIN' | 'MAX' | 'STRETCH' | 'CENTER';
  gutterSize: number;
  count: number;        // Infinity for "Auto"
  sectionSize?: number; // ignored if STRETCH
  offset?: number;      // ignored if CENTER
  visible: boolean;
  color: RGBA;
}

interface GridLayoutGrid {
  pattern: 'GRID';
  sectionSize: number;
  visible: boolean;
  color: RGBA;
}

// Apply to frame
frame.layoutGrids = [{
  pattern: 'COLUMNS',
  alignment: 'STRETCH',
  gutterSize: 20,
  count: 12,
  visible: true,
  color: { r: 1, g: 0, b: 0, a: 0.1 }
}];
```

---

## Constraints (CSS position: absolute)

For absolutely positioned elements in a frame:

```typescript
node.constraints = {
  horizontal: 'MIN' | 'CENTER' | 'MAX' | 'STRETCH' | 'SCALE',
  vertical: 'MIN' | 'CENTER' | 'MAX' | 'STRETCH' | 'SCALE'
};
```

| CSS | Figma Constraint |
|-----|------------------|
| `left: 0` | `horizontal: 'MIN'` |
| `right: 0` | `horizontal: 'MAX'` |
| `left: 0; right: 0` | `horizontal: 'STRETCH'` |
| `top: 0` | `vertical: 'MIN'` |
| `bottom: 0` | `vertical: 'MAX'` |
| `position: fixed` | Same as absolute in Figma |

