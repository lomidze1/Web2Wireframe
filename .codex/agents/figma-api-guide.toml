## Masks

### Basic Masking
```typescript
// Make a node act as mask for siblings below it
node.isMask = true;

// Mask types
node.maskType = 'ALPHA' | 'VECTOR' | 'LUMINANCE';
```

### Mask Types
```typescript
// ALPHA (default) - Uses alpha channel
// CSS: mask-mode: alpha
maskNode.maskType = 'ALPHA';

// VECTOR - Uses outline shape only
// CSS: clip-path (basic shapes)
maskNode.maskType = 'VECTOR';

// LUMINANCE - Uses brightness as alpha
// CSS: mask-mode: luminance
maskNode.maskType = 'LUMINANCE';
```

### CSS clip-path → Figma Mask
```typescript
// CSS: clip-path: circle(50%)
const circle = figma.createEllipse();
circle.resize(100, 100);
circle.isMask = true;
circle.maskType = 'VECTOR';

parent.appendChild(circle);
parent.appendChild(contentNode);  // masked by circle
```

