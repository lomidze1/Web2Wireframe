server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback + pre-rendered pages
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Cache static assets (1 year, immutable)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to backend service
    location /api/ {
        proxy_pass http://api:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /web/ {
        proxy_pass http://api:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://api:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Without this the API (express-session behind `trust proxy`) sees the
        # proxied request as plain HTTP and, because cookie.secure=true in
        # production, refuses to set the session cookie. The OAuth `state` is
        # stored in that cookie, so the Figma callback then reads an empty
        # session → "Invalid state". The /api/ block already forwards this; the
        # /auth/ and /web/ blocks were missing it.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------
    # The TLS terminator (Cloudflare/Vercel/etc.) handles HTTPS — these
    # headers ride along on every nginx response so even a misconfigured
    # edge can't ship a customer payload without them.
    #
    # `always` is required for nginx to emit headers on 4xx/5xx responses
    # too (otherwise an attacker probing 404s sees a clean error page that
    # downstream caches might treat as cacheable HTML).
    # ------------------------------------------------------------------

    # Clickjacking — both X-Frame-Options (legacy) and CSP frame-ancestors
    # are sent for belt-and-braces. CSP supersedes; the legacy header is
    # there for ancient browsers.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # MIME-type sniffing protection — script tags refusing text/plain etc.
    add_header X-Content-Type-Options "nosniff" always;

    # HSTS: 1 year, include subdomains, eligible for browser preload list.
    # The Pro flow opens pay.flitt.com in a new tab; HSTS only governs
    # web2wireframe.design itself, so this won't break Flitt redirects.
    # `preload` requires the apex domain to be HTTPS-only — verify before
    # submitting to https://hstspreload.org/.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # CSP — explicit allow-list for sources. Tuned for this site:
    #   - default-src 'self'   : everything else inherits from this
    #   - script-src 'self'    : no inline scripts (Vite emits external .js)
    #   - style-src 'self' 'unsafe-inline'
    #                          : SCSS modules + React inline `style` attrs
    #   - img-src ... https:   : assets + remote images on customer-visible
    #                            docs / about pages
    #   - connect-src 'self'   : /api/* is proxied on this host, so 'self'
    #                            covers all XHR/fetch destinations
    #   - form-action 'self'   : no <form action="https://other"> anywhere
    #   - frame-ancestors 'none' : we are never iframed (X-Frame-Options also)
    #   - base-uri 'self'      : prevents <base> tag injection
    #   - object-src 'none'    : no Flash/legacy plugins ever
    #   - upgrade-insecure-requests : block any stray http:// asset
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # Referrer policy — send the origin (not the full URL) when navigating
    # cross-origin, so Pricing→pay.flitt.com leaks no UTM/query.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions-Policy — disable features we never use, so a future XSS
    # can't piggy-back on camera/mic/geolocation.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
}
